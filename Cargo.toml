[package]
name = "traits"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Reusable preferences for your AI agent"
repository = "https://github.com/crosshatch/traits"
exclude = ["/repos", "/.agents", "/.github"]

[[bin]]
name = "traits"
path = "src/main.rs"

[lib]
name = "traits"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
indexmap = "2"
kdl = "6.7"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.6.0", features = ["server", "transport-io", "macros", "elicitation", "schemars"] }
saphyr = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
