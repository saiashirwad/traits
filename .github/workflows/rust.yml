name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --bin traits
      - run: python3 -m py_compile .opencode/skills/verify-traits/control-traits
      - run: test -f .opencode/skills/verify-traits/SKILL.md
      - run: test -f .opencode/skills/verify-traits/features/README.md
